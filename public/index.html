<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102a43" />
  <title>HCT ClassQuest 3.1 · Pixel Adventure</title>
  <link rel="stylesheet" href="styles.css" /><link rel="stylesheet" href="arcade.css" /><link rel="stylesheet" href="contrast-fixes.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="contrast-final.css?v=313">
  <link rel="stylesheet" href="question-focus.css?v=314">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">HCT</span><div><strong>ClassQuest <em class="arcade-edition">PIXEL ADVENTURE</em></strong><small id="contextLine">Learn • Challenge • Engage</small></div></div>
      <div class="top-actions"><span id="progressPill" class="pill hidden">0 / 0 completed</span><button id="teacherBtn" class="btn ghost hidden">Teacher Controls</button></div>
    </header>
    <div class="arcade-landscape" aria-hidden="true"><div class="arcade-landscape-label"><span>★ THE CLASSROOM ADVENTURE ★</span><strong>LEARN. CHALLENGE. LEVEL UP.</strong></div></div><main id="main" class="main"></main>
    <aside id="scoreboard" class="scoreboard hidden" aria-hidden="true"></aside>
  </div>
  <dialog id="teacherDialog"><div class="dialog-head"><h2>Teacher Controls</h2><button class="icon-btn" data-close-dialog>×</button></div><div id="teacherControls"></div></dialog>
  <dialog id="confirmDialog"><div class="dialog-head"><h2>Confirm action</h2><button class="icon-btn" data-close-confirm>×</button></div><p id="confirmText"></p><div class="dialog-actions"><button class="btn ghost" data-close-confirm>Cancel</button><button id="confirmYes" class="btn danger">Confirm</button></div></dialog>
  <script src="ai-generator.js"></script>
  <script src="app.js"></script>
  <script src="live.js"></script>
</body>
</html>
